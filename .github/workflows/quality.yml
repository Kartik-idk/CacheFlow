name: Static checks

on:
  push:
    branches: [main]
    paths:
      - 'script.js'
      - 'index.html'
      - 'style.css'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'script.js'
      - 'index.html'
      - 'style.css'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check script.js
